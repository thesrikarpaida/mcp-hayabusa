[project]
name = "mcp-hayabusa"
version = "0.1.0"
description = "Model Context Protocol server wrapping the Hayabusa Windows event log DFIR / threat-hunting tool"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.2.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
mcp-hayabusa = "mcp_hayabusa.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_hayabusa"]

[tool.uv]
# uv manages the virtual environment (.venv/) and lock file (uv.lock).
# Use `uv run` instead of activating the venv manually.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
