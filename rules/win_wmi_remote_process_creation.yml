title: Remote Process Creation via WMI Provider Host
id: 3d9e7c14-58ab-4f26-9d0e-71c2a6b8e945
status: experimental
description: |
    Detects a process spawned by WmiPrvSE.exe, the WMI provider host. Remote
    WMI process creation (win32_process Create) surfaces this way and is a
    common hands-on-keyboard lateral movement technique.
references:
    - https://attack.mitre.org/techniques/T1047/
author: mcp-hayabusa
date: 2026-07-15
tags:
    - attack.execution
    - attack.lateral-movement
    - attack.t1047
logsource:
    product: windows
    service: security
detection:
    security:
        Channel: Security
    selection:
        EventID: 4688
        ParentProcessName|endswith: \WmiPrvSE.exe
    filter_known_good:
        NewProcessName|endswith:
            - \WerFault.exe
            - \conhost.exe
    condition: security and selection and not filter_known_good
falsepositives:
    - Monitoring and inventory agents that query WMI on a schedule
    - SCCM/Intune software deployment
level: medium
ruletype: Sigma
