techniques:
  AML.T0000:
    name: Search Open Technical Databases
    description: 'Adversaries may search for publicly available research and technical documentation to
      learn how and where AI is used within a victim organization.

      The adversary can use this information to identify targets for attack, or to tailor an existing
      attack to make it more effective.

      Organizations often use open source model architectures trained on additional proprietary data in
      production.

      Knowledge of this underlying architecture allows the adversary to craft more realistic proxy models
      ([Create Proxy AI Model](/techniques/AML.T0005)).

      An adversary can search these resources for publications by aut …'
    tactics:
    - reconnaissance
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0000
    deprecated: false
    revoked: false
  AML.T0000.000:
    name: Journals and Conference Proceedings
    description: 'Many of the publications accepted at premier artificial intelligence conferences and
      journals come from commercial labs.

      Some journals and conferences are open access, others may require paying for access or a membership.

      These publications will often describe in detail all aspects of a particular approach for reproducibility.

      This information can be used by adversaries to implement the paper.'
    tactics:
    - reconnaissance
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0000.000
    deprecated: false
    revoked: false
  AML.T0000.001:
    name: Pre-Print Repositories
    description: 'Pre-Print repositories, such as arXiv, contain the latest academic research papers that
      haven''t been peer reviewed.

      They may contain research notes, or technical reports that aren''t typically published in journals
      or conference proceedings.

      Pre-print repositories also serve as a central location to share papers that have been accepted
      to journals.

      Searching pre-print repositories  provides adversaries with a relatively up-to-date view of what
      researchers in the victim organization are working on.'
    tactics:
    - reconnaissance
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0000.001
    deprecated: false
    revoked: false
  AML.T0000.002:
    name: Technical Blogs
    description: 'Research labs at academic institutions and company R&D divisions often have blogs that
      highlight their use of artificial intelligence and its application to the organization''s unique
      problems.

      Individual researchers also frequently document their work in blog posts.

      An adversary may search for posts made by the target victim organization or its employees.

      In comparison to [Journals and Conference Proceedings](/techniques/AML.T0000.000) and [Pre-Print
      Repositories](/techniques/AML.T0000.001) this material will often contain more practical aspects
      of the AI system.

      This could include underlying …'
    tactics:
    - reconnaissance
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0000.002
    deprecated: false
    revoked: false
  AML.T0001:
    name: Search Open AI Vulnerability Analysis
    description: 'Much like the [Search Open Technical Databases](/techniques/AML.T0000), there is often
      ample research available on the vulnerabilities of common AI models. Once a target has been identified,
      an adversary will likely try to identify any pre-existing work that has been done for this class
      of models.

      This will include not only reading academic papers that may identify the particulars of a successful
      attack, but also identifying pre-existing implementations of those attacks.'
    tactics:
    - reconnaissance
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0001
    deprecated: false
    revoked: false
  AML.T0002:
    name: Acquire Public AI Artifacts
    description: 'Adversaries may search public sources, including cloud storage, public-facing services,
      and software or data repositories, to identify AI artifacts.

      These AI artifacts may include the software stack used to train and deploy models, training and
      testing data, model configurations and parameters.

      An adversary will be particularly interested in artifacts hosted by or associated with the victim
      organization as they may represent what that organization uses in a production environment.

      Adversaries may identify artifact repositories via other resources associated with the victim organization
      (e.g.'
    tactics:
    - resource-development
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0002
    deprecated: false
    revoked: false
  AML.T0002.000:
    name: Datasets
    description: 'Adversaries may collect public datasets to use in their operations.

      Datasets used by the victim organization or datasets that are representative of the data used by
      the victim organization may be valuable to adversaries.

      Datasets can be stored in cloud storage, or on victim-owned websites.

      Some datasets require the adversary to [Establish Accounts](/techniques/AML.T0021) for access.'
    tactics:
    - resource-development
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0002.000
    deprecated: false
    revoked: false
  AML.T0002.001:
    name: Models
    description: 'Adversaries may acquire public models to use in their operations.

      Adversaries may seek models used by the victim organization or models that are representative of
      those used by the victim organization.

      Representative models may include model architectures, or pre-trained models which define the architecture
      as well as model parameters from training on a dataset.

      The adversary may search public sources for common model architecture configuration file formats
      such as YAML or Python configuration files, and common model storage file formats such as ONNX (.onnx),
      HDF5 (.h5), Pickle (.pkl), PyTorch …'
    tactics:
    - resource-development
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0002.001
    deprecated: false
    revoked: false
  AML.T0002.002:
    name: AI Agent Configuration
    description: Adversaries may acquire publicly accessible AI agent configuration files to understand
      agent capabilities, gain unauthorized access to tools and data sources, or identify credentials
      for further attacks. Configuration files define what tools an agent can use, credentials for external
      services, system prompts, and behavioral settings, making them valuable resources for adversaries
      targeting AI agent deployments.
    tactics:
    - resource-development
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0002.002
    deprecated: false
    revoked: false
  AML.T0003:
    name: Search Victim-Owned Websites
    description: 'Adversaries may search websites owned by the victim for information that can be used
      during targeting.

      Victim-owned websites may contain technical details about their AI-enabled products or services.

      Victim-owned websites may contain a variety of details, including names of departments/divisions,
      physical locations, and data about key employees such as names, roles, and contact info.

      These sites may also have details highlighting business operations and relationships.'
    tactics:
    - reconnaissance
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0003
    deprecated: false
    revoked: false
  AML.T0004:
    name: Search Application Repositories
    description: 'Adversaries may search open application repositories during targeting.

      Examples of these include Google Play, the iOS App store, the macOS App Store, and the Microsoft
      Store.'
    tactics:
    - reconnaissance
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0004
    deprecated: false
    revoked: false
  AML.T0005:
    name: Create Proxy AI Model
    description: 'Adversaries may obtain models to serve as proxies for the target model in use at the
      victim organization.

      Proxy models are used to simulate complete access to the target model in a fully offline manner.'
    tactics:
    - ai-attack-adaptation
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0005
    deprecated: false
    revoked: false
  AML.T0005.000:
    name: Train Proxy via Gathered AI Artifacts
    description: 'Proxy models may be trained from AI artifacts (such as data, model architectures, and
      pre-trained models) that are representative of the target model gathered by the adversary.

      This can be used to develop attacks that require higher levels of access than the adversary has
      available or as a means to validate pre-existing attacks without interacting with the target model.'
    tactics:
    - ai-attack-adaptation
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0005.000
    deprecated: false
    revoked: false
  AML.T0005.001:
    name: Train Proxy via Replication
    description: 'Adversaries may replicate a private model.

      By repeatedly querying the victim''s [AI Model Inference API Access](/techniques/AML.T0040), the
      adversary can collect the target model''s inferences into a dataset.

      The inferences are used as labels for training a separate model offline that will mimic the behavior
      and performance of the target model.'
    tactics:
    - ai-attack-adaptation
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0005.001
    deprecated: false
    revoked: false
  AML.T0005.002:
    name: Use Pre-Trained Model
    description: Adversaries may use an off-the-shelf pre-trained model as a proxy for the victim model
      to aid in staging the attack.
    tactics:
    - ai-attack-adaptation
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0005.002
    deprecated: false
    revoked: false
  AML.T0006:
    name: Active Scanning
    description: An adversary may probe or scan the victim system to gather information for targeting.
      This is distinct from other reconnaissance techniques that do not involve direct interaction with
      the victim system.
    tactics:
    - reconnaissance
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0006
    deprecated: false
    revoked: false
  AML.T0007:
    name: Discover AI Artifacts
    description: 'Adversaries may search private sources to identify AI learning artifacts that exist
      on the system and gather information about them.

      These artifacts can include the software stack used to train and deploy models, training and testing
      data management systems, container registries, software repositories, and model zoos.'
    tactics:
    - discovery
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0007
    deprecated: false
    revoked: false
  AML.T0008:
    name: Acquire Infrastructure
    description: 'Adversaries may buy, lease, or rent infrastructure for use throughout their operation.

      A wide variety of infrastructure exists for hosting and orchestrating adversary operations.

      Infrastructure solutions include physical or cloud servers, domains, mobile devices, and third-party
      web services.

      Free resources may also be used, but they are typically limited.

      Infrastructure can also include physical components such as countermeasures that degrade or disrupt
      AI components or sensors, including printed materials, wearables, or disguises.'
    tactics:
    - resource-development
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0008
    deprecated: false
    revoked: false
  AML.T0008.000:
    name: AI Development Workspaces
    description: 'Developing and staging AI attacks often requires expensive compute resources.

      Adversaries may need access to one or many GPUs in order to develop an attack.

      They may try to anonymously use free resources such as Google Colaboratory, or cloud resources such
      as AWS, Azure, or Google Cloud as an efficient way to stand up temporary resources to conduct operations.

      Multiple workspaces may be used to avoid detection.'
    tactics:
    - resource-development
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0008.000
    deprecated: false
    revoked: false
  AML.T0008.001:
    name: Consumer Hardware
    description: 'Adversaries may acquire consumer hardware to conduct their attacks.

      Owning the hardware provides the adversary with complete control of the environment. These devices
      can be hard to trace.'
    tactics:
    - resource-development
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0008.001
    deprecated: false
    revoked: false
  AML.T0008.002:
    name: Domains
    description: Adversaries may acquire domains that can be used during targeting. Domain names are the
      human readable names used to represent one or more IP addresses. They can be purchased or, in some
      cases, acquired for free.
    tactics:
    - resource-development
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0008.002
    deprecated: false
    revoked: false
  AML.T0008.003:
    name: Physical Countermeasures
    description: Adversaries may acquire or manufacture physical countermeasures to aid or support their
      attack.
    tactics:
    - resource-development
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0008.003
    deprecated: false
    revoked: false
  AML.T0008.004:
    name: Serverless
    description: Adversaries may purchase and configure serverless cloud infrastructure, such as Cloudflare
      Workers, AWS Lambda functions, or Google Apps Scripts, that can be used during targeting. By utilizing
      serverless infrastructure, adversaries can make it more difficult to attribute infrastructure used
      during operations back to them.
    tactics:
    - resource-development
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0008.004
    deprecated: false
    revoked: false
  AML.T0008.005:
    name: AI Service Proxies
    description: Adversaries may utilize commercial proxy services that resell access to AI services such
      as frontier model APIs.
    tactics:
    - resource-development
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0008.005
    deprecated: false
    revoked: false
  AML.T0010:
    name: AI Supply Chain Compromise
    description: 'Adversaries may gain initial access to a system by compromising the unique portions
      of the AI supply chain.

      This could include [Hardware](/techniques/AML.T0010.000), [Data](/techniques/AML.T0010.002) and
      its annotations, parts of the [AI Software](/techniques/AML.T0010.001) stack, or the [Model](/techniques/AML.T0010.003)
      itself.

      In some instances the attacker will need secondary access to fully carry out an attack using compromised
      components of the supply chain.'
    tactics:
    - initial-access
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0010
    deprecated: false
    revoked: false
  AML.T0010.000:
    name: Hardware
    description: Adversaries may target AI systems by disrupting or manipulating the hardware supply chain.
      AI models often run on specialized hardware such as GPUs, TPUs, or embedded devices, but may also
      be optimized to operate on CPUs.
    tactics:
    - initial-access
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0010.000
    deprecated: false
    revoked: false
  AML.T0010.001:
    name: AI Software
    description: Adversaries may target software packages that are commonly used in AI-enabled systems
      or are part of the AI DevOps lifecycle. This can include deep learning frameworks used to build
      AI models (e.g. PyTorch, TensorFlow, Jax), generative AI integration frameworks (e.g. LangChain,
      LangFlow), inference engines, and AI DevOps tools. They may also target the dependency chains of
      any of these software packages [[pytorch]].
    tactics:
    - initial-access
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0010.001
    deprecated: false
    revoked: false
  AML.T0010.002:
    name: Data
    description: 'Data is a key vector of supply chain compromise for adversaries.

      Every AI project will require some form of data.

      Many rely on large open source datasets that are publicly available.

      An adversary could rely on compromising these sources of data.

      The malicious data could be a result of [Poison Training Data](/techniques/AML.T0020) or include
      traditional malware.'
    tactics:
    - initial-access
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0010.002
    deprecated: false
    revoked: false
  AML.T0010.003:
    name: Model
    description: 'AI-enabled systems often rely on open-source models in various ways.

      Most commonly, the victim organization may be using these models for fine-tuning.

      These models will be downloaded from an external source and then used as the base for the model
      as it is tuned on a smaller, private dataset.

      Loading models often requires executing some saved code in the form of a saved model file.

      These can be compromised with traditional malware, or through some adversarial AI techniques.'
    tactics:
    - initial-access
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0010.003
    deprecated: false
    revoked: false
  AML.T0010.004:
    name: Container Registry
    description: An adversary may compromise a victim's container registry by pushing a manipulated container
      image and overwriting an existing container name and/or tag. Users of the container registry as
      well as automated CI/CD pipelines may pull the adversary's container image, compromising their AI
      Supply Chain. This can affect development and deployment environments.
    tactics:
    - initial-access
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0010.004
    deprecated: false
    revoked: false
  AML.T0010.005:
    name: AI Agent Tool
    description: Adversaries may target AI agent tools as a means to compromise a victim's AI supply chain.
      Tools add capabilities to AI agents, allowing them to interact with other services, connect to data
      sources, access internet resources, run system tools, and execute code. They are an attractive target
      for adversaries because compromising an AI agent can provide them with broad access and permissions
      on the victim's system via the agent's other tools.
    tactics:
    - initial-access
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0010.005
    deprecated: false
    revoked: false
  AML.T0011:
    name: User Execution
    description: An adversary may rely upon a user to load, execute, interpret, or otherwise use a malicious
      or unsafe artifact. In AI systems, user execution may include loading a model or causing an inference
      runtime to process executable or behavior-shaping components bundled with an AI artifact. The resulting
      effect may include host code execution or malicious AI behavior.
    tactics:
    - execution
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0011
    deprecated: false
    revoked: false
  AML.T0011.000:
    name: Unsafe AI Artifacts
    description: Adversaries may develop new AI artifacts or manipulate existing AI artifacts that have
      a deleterious effect when loaded, executed, interpreted, or used for inference by a victim. The
      unsafe artifacts may continue to work as expected from the victim's perspective.
    tactics:
    - execution
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0011.000
    deprecated: false
    revoked: false
  AML.T0011.001:
    name: Malicious Package
    description: 'Adversaries may develop malicious software packages that when imported by a user have
      a deleterious effect.

      Malicious packages may behave as expected to the user. They may be introduced via [AI Supply Chain
      Compromise](/techniques/AML.T0010). They may not present as obviously malicious to the user and
      may appear to be useful for an AI-related task.'
    tactics:
    - execution
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0011.001
    deprecated: false
    revoked: false
  AML.T0011.002:
    name: Poisoned AI Agent Tool
    description: A victim may invoke a poisoned tool when interacting with an AI agent. Invocation may
      expose the agent to poisoned definitions or responses, execute malicious tool implementation logic,
      or cause the agent to invoke additional tools. Poisoned tools may be introduced through AI software,
      installed packages, skills, or connections to remotely hosted services.
    tactics:
    - execution
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0011.002
    deprecated: false
    revoked: false
  AML.T0011.003:
    name: Malicious Link
    description: An adversary may rely upon a user clicking a malicious link in order to gain execution.
      Users may be subjected to social engineering to get them to click on a link that will lead to code
      execution. This user action will typically be observed as follow-on behavior from Spearphishing
      Link. Clicking on a link may also lead to other execution techniques such as exploitation of a browser
      or application vulnerability via Exploitation for Client Execution. Links may also lead users to
      download files that require execution via Malicious File.
    tactics:
    - execution
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0011.003
    deprecated: false
    revoked: false
  AML.T0012:
    name: Valid Accounts
    description: 'Adversaries may obtain and abuse credentials of existing accounts as a means of gaining
      Initial Access.

      Credentials may take the form of usernames and passwords of individual user accounts or API keys
      that provide access to various AI resources and services.'
    tactics:
    - initial-access
    - privilege-escalation
    - lateral-movement
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0012
    deprecated: false
    revoked: false
  AML.T0013:
    name: Discover AI Model Ontology
    description: 'Adversaries may discover the ontology of an AI model''s output space, for example, the
      types of objects a model can detect.

      The adversary may discover the ontology by repeated queries to the model, forcing it to enumerate
      its output space.

      Or the ontology may be discovered in a configuration file or in documentation about the model.'
    tactics:
    - discovery
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0013
    deprecated: false
    revoked: false
  AML.T0014:
    name: Discover AI Model Family
    description: 'Adversaries may discover the general family of a model.

      General information about the model may be revealed in documentation, or the adversary may use carefully
      constructed examples and analyze the model''s responses to categorize it.'
    tactics:
    - discovery
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0014
    deprecated: false
    revoked: false
  AML.T0015:
    name: Evade AI Model
    description: Adversaries can [Craft Adversarial Data](/techniques/AML.T0043) that prevents an AI model
      from correctly identifying the contents of the data or [Generate Deepfakes](/techniques/AML.T0088)
      that fools an AI model expecting authentic data.
    tactics:
    - initial-access
    - defense-evasion
    - impact
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0015
    deprecated: false
    revoked: false
  AML.T0016:
    name: Obtain Capabilities
    description: 'Adversaries may search for and obtain software capabilities for use in their operations.

      Capabilities may be specific to AI-based attacks [Adversarial AI Attack Implementations](/techniques/AML.T0016.000)
      or generic software tools repurposed for malicious intent ([Software Tools](/techniques/AML.T0016.001)).
      In both instances, an adversary may modify or customize the capability to aid in targeting a particular
      AI-enabled system.'
    tactics:
    - resource-development
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0016
    deprecated: false
    revoked: false
  AML.T0016.000:
    name: Adversarial AI Attack Implementations
    description: Adversaries may search for existing open source implementations of AI attacks. The research
      community often publishes their code for reproducibility and to further future research. Libraries
      intended for research purposes, such as CleverHans, the Adversarial Robustness Toolbox, and FoolBox,
      can be weaponized by an adversary. Adversaries may also obtain and use tools that were not originally
      designed for adversarial AI attacks as part of their attack.
    tactics:
    - resource-development
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0016.000
    deprecated: false
    revoked: false
  AML.T0016.001:
    name: Software Tools
    description: 'Adversaries may search for and obtain software tools to support their operations.

      Software designed for legitimate use may be repurposed by an adversary for malicious intent.

      An adversary may modify or customize software tools to achieve their purpose.

      Software tools used to support attacks on AI systems are not necessarily AI-based themselves.'
    tactics:
    - resource-development
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0016.001
    deprecated: false
    revoked: false
  AML.T0016.002:
    name: Generative AI
    description: Adversaries may search for and obtain generative AI models or tools, such as large language
      models (LLMs), to assist them in various steps of their operation. Generative AI can be used in
      a variety of malicious ways, such as to generate malware, to [Generate Deepfakes](/techniques/AML.T0088),
      to [Generate Malicious Commands](/techniques/AML.T0102), for [Retrieval Content Crafting](/techniques/AML.T0066),
      or to generate [Phishing](/techniques/AML.T0052) content.
    tactics:
    - resource-development
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0016.002
    deprecated: false
    revoked: false
  AML.T0016.003:
    name: Exploits
    description: Adversaries may search for and obtain exploits to support their operations. An exploit
      takes advantage of a bug or vulnerability in order to cause unintended or unanticipated behavior
      to occur on computer hardware or software. Exploits may be downloaded from public repositories,
      acquired from private sources, purchased, stolen, or obtained from vulnerability research and exploit-sharing
      communities. An obtained exploit may be used without modification or serve as input to later adaptation
      or development.
    tactics:
    - resource-development
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0016.003
    deprecated: false
    revoked: false
  AML.T0016.004:
    name: AI Agent Tools
    description: Adversaries may search for and obtain tools extend the capabilities of an AI agent. These
      capabilities may allow an agent to interact with operating systems, browsers, networks, cloud services,
      data stores, software repositories, identity systems, or other external resources.
    tactics:
    - resource-development
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0016.004
    deprecated: false
    revoked: false
  AML.T0017:
    name: Develop Capabilities
    description: Adversaries may develop their own capabilities to support operations. This process encompasses
      identifying requirements, building or adapting solutions, validating or packaging capabilities,
      and preparing them for deployment. Capabilities used to support attacks on AI-enabled systems are
      not necessarily AI-based themselves. Adversaries may also use autonomous AI agents to iteratively
      develop capabilities, including exploit methods for known or previously unknown software vulnerabilities.
    tactics:
    - resource-development
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0017
    deprecated: false
    revoked: false
  AML.T0017.000:
    name: Adversarial AI Attacks
    description: 'Adversaries may develop their own adversarial attacks.

      They may leverage existing libraries as a starting point ([Adversarial AI Attack Implementations](/techniques/AML.T0016.000)).

      They may implement ideas described in public research papers or develop custom made attacks for
      the victim model.'
    tactics:
    - resource-development
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0017.000
    deprecated: false
    revoked: false
  AML.T0017.001:
    name: Autonomous Exploit Development
    description: An autonomous AI agent may identify a software vulnerability and develop or materially
      adapt an exploit capability with limited human direction. The agent may analyze source code, documentation,
      service behavior, and error responses to infer a vulnerability and the conditions required to exploit
      it.
    tactics:
    - resource-development
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0017.001
    deprecated: false
    revoked: false
  AML.T0017.002:
    name: AI Agent Tools
    description: Adversaries may develop or materially adapt tools, integrations, or tool servers designed
      to extend the capabilities of an AI agent. These capabilities may allow an agent to interact with
      operating systems, browsers, networks, cloud services, data stores, software repositories, identity
      systems, or other external resources.
    tactics:
    - resource-development
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0017.002
    deprecated: false
    revoked: false
  AML.T0018:
    name: Manipulate AI Model
    description: Adversaries may manipulate an AI model artifact or its bundled components to change AI
      system behavior, introduce malicious code, or establish persistent malicious functionality. This
      may include modifying model weights, model architecture, or prompt-construction logic.
    tactics:
    - ai-attack-adaptation
    - persistence
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0018
    deprecated: false
    revoked: false
  AML.T0018.000:
    name: Poison AI Model
    description: 'Adversaries may manipulate an AI model''s weights to change it''s behavior or performance,
      resulting in a poisoned model.

      Adversaries may poison a model by directly manipulating its weights, training the model on poisoned
      data, further fine-tuning the model, or otherwise interfering with its training process.'
    tactics:
    - ai-attack-adaptation
    - persistence
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0018.000
    deprecated: false
    revoked: false
  AML.T0018.001:
    name: Modify AI Model Architecture
    description: Adversaries may directly modify an AI model's architecture to re-define it's behavior.
      This can include adding or removing layers as well as adding pre or post-processing operations.
    tactics:
    - ai-attack-adaptation
    - persistence
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0018.001
    deprecated: false
    revoked: false
  AML.T0018.002:
    name: Embed Malware
    description: 'Adversaries may embed malicious code into AI Model files.

      AI models may be packaged as a combination of instructions and weights.

      Some formats such as pickle files are unsafe to deserialize because they can contain unsafe calls
      such as exec.

      Models with embedded malware may still operate as expected.

      It may allow them to achieve Execution, Command & Control, or Exfiltrate Data.'
    tactics:
    - ai-attack-adaptation
    - persistence
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0018.002
    deprecated: false
    revoked: false
  AML.T0018.003:
    name: Modify Prompt Construction Logic
    description: Adversaries may modify templates, role delimiters, embedded system instructions, tokenizer
      settings, tool-call formatting, or other artifact-bundled logic that constructs the context sent
      to an AI model. Model file formats such as GGUF can package this logic alongside model weights in
      a single distributable artifact. A compatible inference runtime may interpret the modified logic
      during future inference requests, enabling persistent covert instruction injection, altered instruction
      precedence, redirected tool use, or manipulated model output without changing model weights.
    tactics:
    - ai-attack-adaptation
    - persistence
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0018.003
    deprecated: false
    revoked: false
  AML.T0020:
    name: Training Data Poisoning
    description: Adversaries may manipulate data used for training or fine-tuning an AI model to influence
      the resulting model's behavior. Adversaries may add, remove, or modify data samples; alter labels
      or annotations; or manipulate feedback and data-collection processes.
    tactics:
    - persistence
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0020
    deprecated: false
    revoked: false
  AML.T0021:
    name: Establish Accounts
    description: Adversaries may create accounts with various services for use in targeting, to gain access
      to resources needed in [AI Attack Staging](/tactics/AML.TA0001), or for victim impersonation.
    tactics:
    - resource-development
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0021
    deprecated: false
    revoked: false
  AML.T0024:
    name: Exfiltration via AI Inference API
    description: 'Adversaries may exfiltrate private information via [AI Model Inference API Access](/techniques/AML.T0040).

      AI Models have been shown leak private information about their training data (e.g.  [Infer Training
      Data Membership](/techniques/AML.T0024.000), [Invert AI Model](/techniques/AML.T0024.001)).

      The model itself may also be extracted ([Extract AI Model](/techniques/AML.T0024.002)) for the purposes
      of [AI Intellectual Property Theft](/techniques/AML.T0048.004).'
    tactics:
    - exfiltration
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0024
    deprecated: false
    revoked: false
  AML.T0024.000:
    name: Infer Training Data Membership
    description: 'Adversaries may infer the membership of a data sample or global characteristics of the
      data in its training set, which raises privacy concerns.

      Some strategies make use of a shadow model that could be obtained via [Train Proxy via Replication](/techniques/AML.T0005.001),
      others use statistics of model prediction scores.'
    tactics:
    - exfiltration
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0024.000
    deprecated: false
    revoked: false
  AML.T0024.001:
    name: Invert AI Model
    description: 'AI models'' training data could be reconstructed by exploiting the confidence scores
      that are available via an inference API.

      By querying the inference API strategically, adversaries can back out potentially private information
      embedded within the training data.

      This could lead to privacy violations if the attacker can reconstruct the data of sensitive features
      used in the algorithm.'
    tactics:
    - exfiltration
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0024.001
    deprecated: false
    revoked: false
  AML.T0024.002:
    name: Extract AI Model
    description: 'Adversaries may extract a functional copy of a private model.

      By repeatedly querying the victim''s [AI Model Inference API Access](/techniques/AML.T0040), the
      adversary can collect the target model''s inferences into a dataset.

      The inferences are used as labels for training a separate model offline that will mimic the behavior
      and performance of the target model.'
    tactics:
    - exfiltration
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0024.002
    deprecated: false
    revoked: false
  AML.T0025:
    name: Exfiltration via Cyber Means
    description: Adversaries may exfiltrate AI artifacts or other information relevant to their goals
      via traditional cyber means.
    tactics:
    - exfiltration
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0025
    deprecated: false
    revoked: false
  AML.T0029:
    name: Denial of AI Service
    description: 'Adversaries may target AI-enabled systems with a flood of requests for the purpose of
      degrading or shutting down the service.

      Since many AI systems require significant amounts of specialized compute, they are often expensive
      bottlenecks that can become overloaded.

      Adversaries can intentionally craft inputs that require heavy amounts of useless compute from the
      AI system.'
    tactics:
    - impact
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0029
    deprecated: false
    revoked: false
  AML.T0031:
    name: Erode AI Model Integrity
    description: 'Adversaries may degrade the target model''s performance with adversarial data inputs
      to erode confidence in the system over time.

      This can lead to the victim organization wasting time and money both attempting to fix the system
      and performing the tasks it was meant to automate by hand.'
    tactics:
    - impact
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0031
    deprecated: false
    revoked: false
  AML.T0034:
    name: Cost Harvesting
    description: Adversaries may deliberately drive a victim's AI services beyond normal operating capacity
      with the intent of increasing the cost of services. This may be achieved via high-volume, low-complexity
      queries ([Excessive Queries](/techniques/AML.T0034.000)) or low-volume, high-complexity queries
      ([Resource-Intensive Queries](/techniques/AML.T0034.001)). In Generative AI or Agentic AI systems,
      adversarial prompts may be introduced into the model's context to cause ([Agentic Resource Consumption](/techniques/AML.T0034.002)).
    tactics:
    - impact
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0034
    deprecated: false
    revoked: false
  AML.T0034.000:
    name: Excessive Queries
    description: Adversaries may send an excessive number of otherwise normal or low-complexity queries
      to an AI system with the goal of overwhelming its capacity and increasing operating costs.
    tactics:
    - impact
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0034.000
    deprecated: false
    revoked: false
  AML.T0034.001:
    name: Resource-Intensive Queries
    description: Adversaries may craft inputs specifically designed to increase the compute resources
      required for processing.
    tactics:
    - impact
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0034.001
    deprecated: false
    revoked: false
  AML.T0034.002:
    name: Agentic Resource Consumption
    description: Adversaries may coerce an agentic AI system into performing computationally expensive
      tool calls that waste resources and consume API budgets. They may utilize [LLM Prompt Injection](/techniques/AML.T0051)
      or [AI Agent Tool Data Poisoning](/techniques/AML.T0099) with directives that push the agent to
      perform unnecessary API queries, excessive query fan-outs, or many distinct tool calls.
    tactics:
    - impact
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0034.002
    deprecated: false
    revoked: false
  AML.T0035:
    name: AI Artifact Collection
    description: 'Adversaries may collect AI artifacts for [Exfiltration](/tactics/AML.TA0010) or for
      use in [AI Attack Staging](/tactics/AML.TA0001).

      AI artifacts include models and datasets as well as other telemetry data produced when interacting
      with a model.'
    tactics:
    - collection
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0035
    deprecated: false
    revoked: false
  AML.T0036:
    name: Data from Information Repositories
    description: 'Adversaries may leverage information repositories to mine valuable information.

      Information repositories are tools that allow for storage of information, typically to facilitate
      collaboration or information sharing between users, and can store a wide variety of data that may
      aid adversaries in further objectives, or direct access to the target information.'
    tactics:
    - collection
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0036
    deprecated: false
    revoked: false
  AML.T0037:
    name: Data from Local System
    description: Adversaries may search local system sources, such as file systems and configuration files
      or local databases, to find files of interest and sensitive data prior to Exfiltration.
    tactics:
    - collection
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0037
    deprecated: false
    revoked: false
  AML.T0040:
    name: AI Model Inference API Access
    description: 'Adversaries may gain access to a model via legitimate access to the inference API.

      Inference API access can be a source of information to the adversary ([Discover AI Model Ontology](/techniques/AML.T0013),
      [Discover AI Model Family](/techniques/AML.T0014)), a means of staging the attack ([Verify Attack](/techniques/AML.T0042),
      [Craft Adversarial Data](/techniques/AML.T0043)), or for introducing data to the target system for
      Impact ([Evade AI Model](/techniques/AML.T0015), [Erode AI Model Integrity](/techniques/AML.T0031)).'
    tactics:
    - ai-model-access
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0040
    deprecated: false
    revoked: false
  AML.T0041:
    name: Physical Environment Access
    description: 'In addition to the attacks that take place purely in the digital domain, adversaries
      may also exploit the physical environment for their attacks.

      If the model is interacting with data collected from the real world in some way, the adversary can
      influence the model through access to wherever the data is being collected.

      By modifying the data in the collection process, the adversary can perform modified versions of
      attacks designed for digital access.'
    tactics:
    - ai-model-access
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0041
    deprecated: false
    revoked: false
  AML.T0042:
    name: Verify Attack
    description: 'Adversaries can verify the efficacy of their attack via an inference API or access to
      an offline copy of the target model.

      This gives the adversary confidence that their approach works and allows them to carry out the attack
      at a later time of their choosing.

      The adversary may verify the attack once but use it against many edge devices running copies of
      the target model.

      The adversary may verify their attack digitally, then deploy it in the [Physical Environment Access](/techniques/AML.T0041)
      at a later time.

      Verifying the attack may be hard to detect since the adversary can use a minimal numb …'
    tactics:
    - ai-attack-adaptation
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0042
    deprecated: false
    revoked: false
  AML.T0043:
    name: Craft Adversarial Data
    description: 'Adversarial data are inputs to an AI model that have been modified such that they cause
      the adversary''s desired effect in the target model.

      Effects can range from misclassification, to missed detections, to maximizing energy consumption.

      Typically, the modification is constrained in magnitude or location so that a human still perceives
      the data as if it were unmodified, but human perceptibility may not always be a concern depending
      on the adversary''s intended effect.

      For example, an adversarial input for an image classification task is an image the AI model would
      misclassify, but a human would …'
    tactics:
    - ai-attack-adaptation
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0043
    deprecated: false
    revoked: false
  AML.T0043.000:
    name: White-Box Optimization
    description: 'In White-Box Optimization, the adversary has full access to the target model and optimizes
      the adversarial example directly.

      Adversarial examples trained in this manner are most effective against the target model.'
    tactics:
    - ai-attack-adaptation
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0043.000
    deprecated: false
    revoked: false
  AML.T0043.001:
    name: Black-Box Optimization
    description: 'In Black-Box attacks, the adversary has black-box (i.e. [AI Model Inference API Access](/techniques/AML.T0040)
      via API access) access to the target model.

      With black-box attacks, the adversary may be using an API that the victim is monitoring.

      These attacks are generally less effective and require more inferences than [White-Box Optimization](/techniques/AML.T0043.000)
      attacks, but they require much less access.'
    tactics:
    - ai-attack-adaptation
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0043.001
    deprecated: false
    revoked: false
  AML.T0043.002:
    name: Black-Box Transfer
    description: 'In Black-Box Transfer attacks, the adversary uses one or more proxy models (trained
      via [Create Proxy AI Model](/techniques/AML.T0005) or [Train Proxy via Replication](/techniques/AML.T0005.001))
      they have full access to and are representative of the target model.

      The adversary uses [White-Box Optimization](/techniques/AML.T0043.000) on the proxy models to generate
      adversarial examples.

      If the set of proxy models are close enough to the target model, the adversarial example should
      generalize from one to another.

      This means that an attack that works for the proxy models will likely then work fo …'
    tactics:
    - ai-attack-adaptation
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0043.002
    deprecated: false
    revoked: false
  AML.T0043.003:
    name: Manual Modification
    description: 'Adversaries may manually modify the input data to craft adversarial data.

      They may use their knowledge of the target model to modify parts of the data they suspect helps
      the model in performing its task.

      The adversary may use trial and error until they are able to verify they have a working adversarial
      input.'
    tactics:
    - ai-attack-adaptation
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0043.003
    deprecated: false
    revoked: false
  AML.T0043.004:
    name: Insert Backdoor Trigger
    description: 'The adversary may add a perceptual trigger into inference data.

      The trigger may be imperceptible or non-obvious to humans.

      This technique is used in conjunction with [Poison AI Model](/techniques/AML.T0018.000) and allows
      the adversary to produce their desired effect in the target model.'
    tactics:
    - ai-attack-adaptation
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0043.004
    deprecated: false
    revoked: false
  AML.T0044:
    name: Full AI Model Access
    description: 'Adversaries may gain full "white-box" access to an AI model.

      This means the adversary has complete knowledge of the model architecture, its parameters, and class
      ontology.

      They may exfiltrate the model to [Craft Adversarial Data](/techniques/AML.T0043) and [Verify Attack](/techniques/AML.T0042)
      in an offline environment where it is hard to detect their behavior.'
    tactics:
    - ai-model-access
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0044
    deprecated: false
    revoked: false
  AML.T0046:
    name: Spamming AI System with Chaff Data
    description: 'Adversaries may spam the AI system with chaff data that causes increase in the number
      of detections.

      This can cause analysts at the victim organization to waste time reviewing and correcting incorrect
      inferences.'
    tactics:
    - impact
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0046
    deprecated: false
    revoked: false
  AML.T0047:
    name: AI-Enabled Product or Service
    description: 'Adversaries may use a product or service that uses artificial intelligence under the
      hood to gain access to the underlying AI model.

      This type of indirect model access may reveal details of the AI model or its inferences in logs
      or metadata.'
    tactics:
    - ai-model-access
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0047
    deprecated: false
    revoked: false
  AML.T0048:
    name: External Harms
    description: 'Adversaries may abuse their access to a victim system and use its resources or capabilities
      to further their goals by causing harms external to that system.

      These harms could affect the organization (e.g. Financial Harm, Reputational Harm), its users (e.g.
      User Harm), or the general public (e.g. Societal Harm).'
    tactics:
    - impact
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0048
    deprecated: false
    revoked: false
  AML.T0048.000:
    name: Financial Harm
    description: Financial harm involves the loss of wealth, property, or other monetary assets due to
      theft, fraud or forgery, or pressure to provide financial resources to the adversary.
    tactics:
    - impact
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0048.000
    deprecated: false
    revoked: false
  AML.T0048.001:
    name: Reputational Harm
    description: Reputational harm involves a degradation of public perception and trust in organizations.  Examples
      of reputation-harming incidents include scandals or false impersonations.
    tactics:
    - impact
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0048.001
    deprecated: false
    revoked: false
  AML.T0048.002:
    name: Societal Harm
    description: Societal harms might generate harmful outcomes that reach either the general public or
      specific vulnerable groups such as the exposure of children to vulgar content.
    tactics:
    - impact
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0048.002
    deprecated: false
    revoked: false
  AML.T0048.003:
    name: User Harm
    description: User harms may encompass a variety of harm types including financial and reputational
      that are directed at or felt by individual victims of the attack rather than at the organization
      level.
    tactics:
    - impact
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0048.003
    deprecated: false
    revoked: false
  AML.T0048.004:
    name: AI Intellectual Property Theft
    description: Adversaries may exfiltrate AI artifacts to steal intellectual property and cause economic
      harm to the victim organization.
    tactics:
    - impact
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0048.004
    deprecated: false
    revoked: false
  AML.T0049:
    name: Exploit Public-Facing Application
    description: Adversaries may attempt to take advantage of a weakness in an Internet-facing computer
      or program using software, data, or commands in order to cause unintended or unanticipated behavior.
      The weakness in the system can be a bug, a glitch, or a design vulnerability. These applications
      are often websites, but can include databases (like SQL), standard services (like SMB or SSH), network
      device administration and management protocols (like SNMP and Smart Install), and any other applications
      with Internet accessible open sockets, such as web servers and related services.
    tactics:
    - initial-access
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0049
    deprecated: false
    revoked: false
  AML.T0050:
    name: Command and Scripting Interpreter
    description: Adversaries may abuse command and script interpreters to execute commands, scripts, or
      binaries. These interfaces and languages provide ways of interacting with computer systems and are
      a common feature across many different platforms. Most systems come with some built-in command-line
      interface and scripting capabilities, for example, macOS and Linux distributions include some flavor
      of Unix Shell while Windows installations include the Windows Command Shell and PowerShell.
    tactics:
    - execution
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0050
    deprecated: false
    revoked: false
  AML.T0051:
    name: LLM Prompt Injection
    description: 'An adversary may craft malicious prompts as inputs to an LLM that cause the LLM to act
      in unintended ways.

      These "prompt injections" are often designed to cause the model to ignore aspects of its original
      instructions and follow the adversary''s instructions instead.'
    tactics:
    - execution
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0051
    deprecated: false
    revoked: false
  AML.T0051.000:
    name: Direct
    description: An adversary may inject prompts directly as a user of the LLM. This type of injection
      may be used by the adversary to gain a foothold in the system or to misuse the LLM itself, as for
      example to generate harmful content.
    tactics:
    - execution
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0051.000
    deprecated: false
    revoked: false
  AML.T0051.001:
    name: Indirect
    description: 'An adversary may inject prompts indirectly via a separate data channel ingested by the
      LLM, such as text or multimedia pulled from databases or websites.

      These malicious prompts may be hidden or obfuscated from the user. This type of injection may be
      used by the adversary to gain a foothold in the system or to target an unwitting user of the system.'
    tactics:
    - execution
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0051.001
    deprecated: false
    revoked: false
  AML.T0051.002:
    name: Triggered
    description: An adversary may trigger a prompt injection via a user action or event that occurs within
      the victim's environment. Triggered prompt injections often target AI agents, which can be activated
      by means the adversary identifies during [Discovery](/tactics/AML.TA0008) (See [Activation Triggers](/techniques/AML.T0084.002)).
      These malicious prompts may be hidden or obfuscated from the user and may already exist somewhere
      in the victim's environment from the adversary performing [Prompt Infiltration via Public-Facing
      Application](/techniques/AML.T0093).
    tactics:
    - execution
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0051.002
    deprecated: false
    revoked: false
  AML.T0052:
    name: Phishing
    description: Adversaries may send phishing messages to gain access to victim systems. All forms of
      phishing are electronically delivered social engineering. Phishing can be targeted, known as spearphishing.
      In spearphishing, a specific individual, company, or industry will be targeted by the adversary.
      More generally, adversaries can conduct non-targeted phishing, such as in mass malware spam campaigns.
    tactics:
    - initial-access
    - lateral-movement
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0052
    deprecated: false
    revoked: false
  AML.T0052.000:
    name: Spearphishing via Social Engineering LLM
    description: 'Adversaries may turn LLMs into targeted social engineers.

      LLMs are capable of interacting with users via text conversations.

      They can be instructed by an adversary to seek sensitive information from a user and act as effective
      social engineers.

      They can be targeted towards particular personas defined by the adversary.

      This allows adversaries to scale spearphishing efforts and target individuals to reveal private
      information such as credentials to privileged systems.'
    tactics:
    - initial-access
    - lateral-movement
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0052.000
    deprecated: false
    revoked: false
  AML.T0052.001:
    name: Deepfake-Assisted Phishing
    description: Adversaries may use deepfakes (AI-generated synthetic images, audio, or video) in phishing
      campaigns to impersonate trusted individuals, executives, or organizations. These attacks exploit
      human trust by presenting fraudulent voice or video communications as legitimate, enabling adversaries
      to manipulate targets into disclosing credentials, transferring funds, or granting access to systems.
    tactics:
    - initial-access
    - lateral-movement
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0052.001
    deprecated: false
    revoked: false
  AML.T0053:
    name: AI Agent Tool Invocation
    description: Adversaries may use their access to an AI agent to invoke tools the agent has access
      to. LLMs are often connected to other services or resources via tools to increase their capabilities.
      Tools may include integrations with other applications, access to public or private data sources,
      and the ability to execute code.
    tactics:
    - execution
    - privilege-escalation
    - lateral-movement
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0053
    deprecated: false
    revoked: false
  AML.T0054:
    name: LLM Jailbreak
    description: Adversaries may induce a large language model (LLM) to ignore, circumvent, or override
      its safety/alignment behaviors and/or guardrails to elicit outputs the model is intended to withhold.
      Once jailbroken, the LLM may be used in unintended ways by the adversary. Jailbreaks may be achieved
      via adversarial prompting, or by modifying model weights or safety mechanisms.
    tactics:
    - defense-evasion
    - privilege-escalation
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0054
    deprecated: false
    revoked: false
  AML.T0055:
    name: Unsecured Credentials
    description: 'Adversaries may search compromised systems to find and obtain insecurely stored credentials.

      These credentials can be stored and/or misplaced in many locations on a system, including plaintext
      files (e.g. bash history), environment variables, operating system, or application-specific repositories
      (e.g. Credentials in Registry), or other specialized files/artifacts (e.g. private keys).'
    tactics:
    - credential-access
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0055
    deprecated: false
    revoked: false
  AML.T0056:
    name: Extract LLM System Prompt
    description: Adversaries may attempt to extract a large language model's (LLM) system prompt. Adversaries
      achieve this via prompt injection that induces the model to reveal its system prompt, or they may
      extract it from a configuration file.
    tactics:
    - exfiltration
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0056
    deprecated: false
    revoked: false
  AML.T0057:
    name: LLM Data Leakage
    description: 'Adversaries may craft prompts that induce the LLM to leak sensitive information.

      This can include private user data or proprietary information.

      The leaked information may come from proprietary training data, data sources the LLM is connected
      to, or information from other users of the LLM.'
    tactics:
    - exfiltration
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0057
    deprecated: false
    revoked: false
  AML.T0059:
    name: Erode Dataset Integrity
    description: Adversaries may poison or manipulate portions of a dataset to reduce its usefulness,
      reduce trust, and cause users to waste resources correcting errors.
    tactics:
    - impact
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0059
    deprecated: false
    revoked: false
  AML.T0060:
    name: Publish Hallucinated Entities
    description: Adversaries may create an entity they control, such as a software package, website, or
      email address corresponding to a source hallucinated by an LLM. The hallucinations may take the
      form of package names, commands, URLs, company names, or email addresses that point the victim to
      the entity controlled by the adversary. When the victim interacts with the adversary-controlled
      entity, the attack can proceed.
    tactics:
    - resource-development
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0060
    deprecated: false
    revoked: false
  AML.T0061:
    name: LLM Prompt Self-Replication
    description: 'An adversary may use a carefully crafted [LLM Prompt Injection](/techniques/AML.T0051)
      designed to cause the LLM to replicate the prompt as part of its output. This allows the prompt
      to propagate to other LLMs and persist on the system. The self-replicating prompt is typically paired
      with other malicious instructions (ex: [LLM Jailbreak](/techniques/AML.T0054), [LLM Data Leakage](/techniques/AML.T0057)).'
    tactics:
    - persistence
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0061
    deprecated: false
    revoked: false
  AML.T0062:
    name: Discover LLM Hallucinations
    description: 'Adversaries may prompt large language models and identify hallucinated entities.

      They may request software packages, commands, URLs, organization names, or e-mail addresses, and
      identify hallucinations with no connected real-world source. Discovered hallucinations provide the
      adversary with potential targets to [Publish Hallucinated Entities](/techniques/AML.T0060). Different
      LLMs have been shown to produce the same hallucinations, so the hallucinations exploited by an adversary
      may affect users of other LLMs.'
    tactics:
    - discovery
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0062
    deprecated: false
    revoked: false
  AML.T0063:
    name: Discover AI Model Outputs
    description: 'Adversaries may discover model outputs, such as class scores, whose presence is not
      required for the system to function and are not intended for use by the end user. Model outputs
      may be found in logs or may be included in API responses.

      Model outputs may enable the adversary to identify weaknesses in the model and develop attacks.'
    tactics:
    - discovery
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0063
    deprecated: false
    revoked: false
  AML.T0064:
    name: Gather RAG-Indexed Targets
    description: Adversaries may identify data sources used in retrieval augmented generation (RAG) systems
      for targeting purposes. By pinpointing these sources, attackers can focus on poisoning or otherwise
      manipulating the external data repositories the AI relies on.
    tactics:
    - reconnaissance
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0064
    deprecated: false
    revoked: false
  AML.T0065:
    name: LLM Prompt Crafting
    description: Adversaries may use their acquired knowledge of the target generative AI system to craft
      prompts that bypass its defenses and allow malicious instructions to be executed.
    tactics:
    - ai-attack-adaptation
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0065
    deprecated: false
    revoked: false
  AML.T0066:
    name: Retrieval Content Crafting
    description: Adversaries may write content designed to be retrieved by user queries and influence
      a user of the system in some way. This abuses the trust the user has in the system.
    tactics:
    - ai-attack-adaptation
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0066
    deprecated: false
    revoked: false
  AML.T0067:
    name: LLM Trusted Output Components Manipulation
    description: Adversaries may utilize prompts to a large language model (LLM) which manipulate various
      components of its response in order to make it appear trustworthy to the user. This helps the adversary
      continue to operate in the victim's environment and evade detection by the users it interacts with.
    tactics:
    - defense-evasion
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0067
    deprecated: false
    revoked: false
  AML.T0067.000:
    name: Citations
    description: Adversaries may manipulate the citations provided in an AI system's response, in order
      to make it appear trustworthy. Variants include providing the wrong citation, making up a new citation,
      or providing the right citation but for adversary-provided data.
    tactics:
    - defense-evasion
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0067.000
    deprecated: false
    revoked: false
  AML.T0068:
    name: LLM Prompt Obfuscation
    description: Adversaries may hide or otherwise obfuscate prompt injections or retrieval content to
      avoid detection from humans, large language model (LLM) guardrails, or other detection mechanisms.
    tactics:
    - defense-evasion
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0068
    deprecated: false
    revoked: false
  AML.T0069:
    name: Discover LLM System Information
    description: The adversary is trying to discover something about the large language model's (LLM)
      system information. This may be found in a configuration file containing the system instructions
      or extracted via interactions with the LLM. The desired information may include the full system
      prompt, special characters that have significance to the LLM or keywords indicating functionality
      available to the LLM. Information about how the LLM is instructed can be used by the adversary to
      understand the system's capabilities and to aid them in crafting malicious prompts.
    tactics:
    - discovery
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0069
    deprecated: false
    revoked: false
  AML.T0069.000:
    name: Special Character Sets
    description: Adversaries may discover delimiters and special characters sets used by the large language
      model. For example, delimiters used in retrieval augmented generation applications to differentiate
      between context and user prompts. These can later be exploited to confuse or manipulate the large
      language model into misbehaving.
    tactics:
    - discovery
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0069.000
    deprecated: false
    revoked: false
  AML.T0069.001:
    name: System Instruction Keywords
    description: Adversaries may discover keywords that have special meaning to the large language model
      (LLM), such as function names or object names. These can later be exploited to confuse or manipulate
      the LLM into misbehaving and to make calls to plugins the LLM has access to.
    tactics:
    - discovery
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0069.001
    deprecated: false
    revoked: false
  AML.T0069.002:
    name: System Prompt
    description: Adversaries may discover a large language model's system instructions provided by the
      AI system builder to learn about the system's capabilities and circumvent its guardrails.
    tactics:
    - discovery
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0069.002
    deprecated: false
    revoked: false
  AML.T0070:
    name: RAG Poisoning
    description: Adversaries may inject malicious content into data indexed by a retrieval augmented generation
      (RAG) system to contaminate a future thread through RAG-based search results. This may be accomplished
      by placing manipulated documents in a location the RAG indexes (see [Gather RAG-Indexed Targets](/techniques/AML.T0064)).
    tactics:
    - persistence
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0070
    deprecated: false
    revoked: false
  AML.T0071:
    name: False RAG Entry Injection
    description: Adversaries may introduce false entries into a victim's retrieval augmented generation
      (RAG) database. Content designed to be interpreted as a document by the large language model (LLM)
      used in the RAG system is included in a data source being ingested into the RAG database. When a
      RAG entry containing the false document is retrieved, the LLM is tricked into treating part of the
      retrieved content as a false RAG result.
    tactics:
    - defense-evasion
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0071
    deprecated: false
    revoked: false
  AML.T0072:
    name: Cyber Communication Channel
    description: Adversaries may establish or use cyber communication channels for command and control.
      A channel may use any network protocol, service, repository, relay, or other intermediary and may
      operate synchronously or asynchronously.
    tactics:
    - command-and-control
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0072
    deprecated: false
    revoked: false
  AML.T0073:
    name: Impersonation
    description: Adversaries may impersonate a trusted person or organization in order to persuade and
      trick a target into performing some action on their behalf. For example, adversaries may communicate
      with victims (via [Phishing](/techniques/AML.T0052), or [Spearphishing via Social Engineering LLM](/techniques/AML.T0052.000))
      while impersonating a known sender such as an executive, colleague, or third-party vendor. Established
      trust can then be leveraged to accomplish an adversary's ultimate goals, possibly against multiple
      victims.
    tactics:
    - defense-evasion
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0073
    deprecated: false
    revoked: false
  AML.T0074:
    name: Masquerading
    description: Adversaries may attempt to manipulate features of their artifacts to make them appear
      legitimate or benign to users and/or security tools. Masquerading occurs when the name or location
      of an object, legitimate or malicious, is manipulated or abused for the sake of evading defenses
      and observation. This may include manipulating file metadata, tricking users into misidentifying
      the file type, and giving legitimate task or service names.
    tactics:
    - defense-evasion
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0074
    deprecated: false
    revoked: false
  AML.T0075:
    name: Enterprise Resource Discovery
    description: Adversaries may discover resources available within an enterprise environment and information
      needed to identify or access them. Resources may include accounts, groups, systems, devices, virtual
      machines, files, directories, storage volumes, cloud objects, containers, applications, software,
      processes, services, network shares, repositories, policies, logs, and other local, remote, or cloud-hosted
      assets.
    tactics:
    - discovery
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0075
    deprecated: false
    revoked: false
  AML.T0076:
    name: Corrupt AI Model
    description: An adversary may purposefully corrupt a malicious AI model file so that it cannot be
      successfully deserialized in order to evade detection by a model scanner. The corrupt model may
      still successfully execute malicious code before deserialization fails.
    tactics:
    - defense-evasion
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0076
    deprecated: false
    revoked: false
  AML.T0077:
    name: LLM Response Rendering
    description: An adversary may get a large language model (LLM) to respond with private information
      that is hidden from the user when the response is rendered by the user's client. The private information
      is then exfiltrated. This can take the form of rendered images, which automatically make a request
      to an adversary controlled server.
    tactics:
    - exfiltration
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0077
    deprecated: false
    revoked: false
  AML.T0078:
    name: Drive-by Compromise
    description: Adversaries may gain access to an AI system through a user visiting a website over the
      normal course of browsing, or an AI agent retrieving information from the web on behalf of a user.
      Websites can contain an [LLM Prompt Injection](/techniques/AML.T0051) which, when executed, can
      change the behavior of the AI model.
    tactics:
    - initial-access
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0078
    deprecated: false
    revoked: false
  AML.T0079:
    name: Stage Capabilities
    description: Adversaries may upload, install, or otherwise set up capabilities that can be used during
      targeting. To support their operations, an adversary may need to take capabilities they developed
      ([Develop Capabilities](/techniques/AML.T0017)) or obtained ([Obtain Capabilities](/techniques/AML.T0016))
      and stage them on infrastructure under their control. These capabilities may be staged on infrastructure
      that was previously purchased/rented by the adversary ([Acquire Infrastructure](/techniques/AML.T0008))
      or was otherwise compromised by them.
    tactics:
    - resource-development
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0079
    deprecated: false
    revoked: false
  AML.T0080:
    name: AI Agent Context Poisoning
    description: Adversaries may attempt to manipulate the context used by an AI agent's large language
      model (LLM) to influence the responses it generates or actions it takes. This allows an adversary
      to persistently change the behavior of the target agent and further their goals.
    tactics:
    - persistence
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0080
    deprecated: false
    revoked: false
  AML.T0080.000:
    name: Memory
    description: Adversaries may manipulate the memory of a large language model (LLM) in order to persist
      changes to the LLM across future chat sessions.
    tactics:
    - persistence
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0080.000
    deprecated: false
    revoked: false
  AML.T0080.001:
    name: Thread
    description: Adversaries may introduce malicious instructions into a chat thread of a large language
      model (LLM) to cause behavior changes which persist for the remainder of the thread. A chat thread
      may continue for an extended period over multiple sessions.
    tactics:
    - persistence
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0080.001
    deprecated: false
    revoked: false
  AML.T0081:
    name: Modify AI Agent Configuration
    description: Adversaries may modify the configuration files for AI agents on a system. This allows
      malicious changes to persist beyond the life of a single agent and affects any agents that share
      the configuration.
    tactics:
    - persistence
    - defense-evasion
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0081
    deprecated: false
    revoked: false
  AML.T0082:
    name: RAG Credential Harvesting
    description: Adversaries may attempt to use their access to a large language model (LLM) on the victim's
      system to collect credentials. Credentials may be stored in internal documents which can inadvertently
      be ingested into a RAG database, where they can ultimately be retrieved by an AI agent.
    tactics:
    - credential-access
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0082
    deprecated: false
    revoked: false
  AML.T0083:
    name: Credentials from AI Agent Configuration
    description: Adversaries may access the credentials of other tools or services on a system from the
      configuration of an AI agent.
    tactics:
    - credential-access
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0083
    deprecated: false
    revoked: false
  AML.T0084:
    name: Discover AI Agent Configuration
    description: Adversaries may attempt to discover configuration information for AI agents present on
      the victim's system. Agent configurations can include tools or services they have access to.
    tactics:
    - discovery
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0084
    deprecated: false
    revoked: false
  AML.T0084.000:
    name: Embedded Knowledge
    description: Adversaries may attempt to discover the data sources a particular agent can access.  The
      AI agent's configuration may reveal data sources or knowledge.
    tactics:
    - discovery
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0084.000
    deprecated: false
    revoked: false
  AML.T0084.001:
    name: Tool Definitions
    description: Adversaries may discover the tools the AI agent has access to. By identifying which tools
      are available, the adversary can understand what actions may be executed through the agent and what
      additional resources it can reach. This knowledge may reveal access to external data sources such
      as OneDrive or SharePoint, or expose exfiltration paths like the ability to send emails, helping
      adversaries identify AI agents that provide the greatest value or opportunity for attack.
    tactics:
    - discovery
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0084.001
    deprecated: false
    revoked: false
  AML.T0084.002:
    name: Activation Triggers
    description: Adversaries may discover keywords or other triggers (such as incoming emails, documents
      being added, incoming message, or other workflows) that activate an agent and may cause it to run
      additional actions.
    tactics:
    - discovery
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0084.002
    deprecated: false
    revoked: false
  AML.T0084.003:
    name: Call Chains
    description: Adversaries may extract call chains from AI agent configurations, which can reveal potentially
      targets for remote code execution (RCE) or other vulnerabilities. Vulnerable call chains often connect
      user inputs or LLM outputs to an execution sink (e.g. exec, eval, os.popen). The vulnerabilities
      may be later exploited via [LLM Prompt Injection](/techniques/AML.T0051).
    tactics:
    - discovery
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0084.003
    deprecated: false
    revoked: false
  AML.T0085:
    name: Data from AI Services
    description: Adversaries may use their access to a victim organization's AI-enabled services to collect
      proprietary or otherwise sensitive information. As organizations adopt generative AI in centralized
      services for accessing an organization's data, such as with chat agents which can access retrieval
      augmented generation (RAG) databases and other data sources via tools, they become increasingly
      valuable targets for adversaries.
    tactics:
    - collection
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0085
    deprecated: false
    revoked: false
  AML.T0085.000:
    name: RAG Databases
    description: Adversaries may prompt the AI service to retrieve data from a RAG database. This can
      include the majority of an organization's internal documents.
    tactics:
    - collection
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0085.000
    deprecated: false
    revoked: false
  AML.T0085.001:
    name: AI Agent Tools
    description: Adversaries may prompt the AI service to invoke various tools the agent has access to.
      Tools may retrieve data from different APIs or services in an organization.
    tactics:
    - collection
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0085.001
    deprecated: false
    revoked: false
  AML.T0086:
    name: Exfiltration via AI Agent Tool Invocation
    description: AI agent tools capable of performing write operations may be invoked to exfiltrate data
      to an adversary. Sensitive information can be encoded into the tool's input parameters and transmitted
      to an adversary-controlled location (such as an inbox, document, or server) as part of a seemingly
      legitimate action. Variants include sending emails, creating or modifying documents, updating CRM
      records, or even generating media such as images or videos.
    tactics:
    - exfiltration
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0086
    deprecated: false
    revoked: false
  AML.T0087:
    name: Gather Victim Identity Information
    description: 'Adversaries may gather information about the victim''s identity that can be used during
      targeting. Information about identities may include a variety of details, including personal data
      (ex: employee names, email addresses, photos, etc.) as well as sensitive details such as credentials
      or multi-factor authentication (MFA) configurations.'
    tactics:
    - reconnaissance
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0087
    deprecated: false
    revoked: false
  AML.T0088:
    name: Generate Deepfakes
    description: Adversaries may use generative artificial intelligence (GenAI) to create synthetic media
      (i.e. imagery, video, audio, and text) that appear authentic. These "[deepfakes]( https://en.wikipedia.org/wiki/Deepfake)"
      may mimic a real person or depict fictional personas. Adversaries may use deepfakes for impersonation
      to conduct [Phishing](/techniques/AML.T0052) or to evade AI applications such as biometric identity
      verification systems (see [Evade AI Model](/techniques/AML.T0015)).
    tactics:
    - ai-attack-adaptation
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0088
    deprecated: false
    revoked: false
  AML.T0089:
    name: Enterprise Environment Discovery
    description: Adversaries may discover configurations, conditions, relationships, activity, and other
      characteristics of an enterprise environment. This may include system and network configuration;
      active connections, processes, windows, and users; permissions, trust relationships, and policy
      settings; installed defensive or backup capabilities; network traffic; browser and registry information;
      or environmental properties such as location, language, time, connectivity, virtualization, debugging,
      and sandbox indicators.
    tactics:
    - discovery
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0089
    deprecated: false
    revoked: false
  AML.T0090:
    name: OS Credential Dumping
    description: Adversaries may extract credentials from OS caches, application memory, or other sources
      on a compromised system. Credentials are often in the form of a hash or clear text, and can include
      usernames and passwords, application tokens, or other authentication keys.
    tactics:
    - credential-access
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0090
    deprecated: false
    revoked: false
  AML.T0091:
    name: Use Alternate Authentication Material
    description: Adversaries may use alternate authentication material, such as password hashes, Kerberos
      tickets, and application access tokens, in order to move laterally within an environment and bypass
      normal system access controls.
    tactics:
    - lateral-movement
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0091
    deprecated: false
    revoked: false
  AML.T0091.000:
    name: Application Access Token
    description: Adversaries may use stolen application access tokens to bypass the typical authentication
      process and access restricted accounts, information, or services on remote systems. These tokens
      are typically stolen from users or services and used in lieu of login credentials.
    tactics:
    - lateral-movement
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0091.000
    deprecated: false
    revoked: false
  AML.T0091.001:
    name: Web Session Cookie
    description: Adversaries may use stolen web session cookies to authenticate to AI-enabled applications
      and supporting services as another user. This technique may bypass some multi-factor authentication
      controls because the session represented by the cookie has already been authenticated.
    tactics:
    - lateral-movement
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0091.001
    deprecated: false
    revoked: false
  AML.T0092:
    name: Manipulate User LLM Chat History
    description: Adversaries may manipulate a user's large language model (LLM) chat history to cover
      the tracks of their malicious behavior. They may hide persistent changes they have made to the LLM's
      behavior, or obscure their attempts at discovering private information about the user.
    tactics:
    - defense-evasion
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0092
    deprecated: false
    revoked: false
  AML.T0093:
    name: Prompt Infiltration via Public-Facing Application
    description: An adversary may introduce malicious prompts into the victim's system via a public-facing
      application with the intention of it being ingested by an AI at some point in the future and ultimately
      having a downstream effect. This may occur when a data source is indexed by a retrieval augmented
      generation (RAG) system, when a rule triggers an action by an AI agent, or when a user utilizes
      a large language model (LLM) to interact with the malicious content.
    tactics:
    - initial-access
    - persistence
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0093
    deprecated: false
    revoked: false
  AML.T0094:
    name: Delay Execution of LLM Instructions
    description: Adversaries may include instructions to be followed by the AI system in response to a
      future event, such as a specific keyword or the next interaction, in order to evade detection or
      bypass controls placed on the AI system.
    tactics:
    - defense-evasion
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0094
    deprecated: false
    revoked: false
  AML.T0095:
    name: Search Open Websites/Domains
    description: Adversaries may search public websites and/or domains for information about victims that
      can be used during targeting. Information about victims may be available in various online sites,
      such as social media, new sites, or domains owned by the victim.
    tactics:
    - reconnaissance
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0095
    deprecated: false
    revoked: false
  AML.T0095.000:
    name: Code Repositories
    description: Adversaries may search public code repositories for information about a victim or victim
      system that can be used during targeting. Victims may store code or artifacts related to their AI
      systems in repositories on various third-party websites such as GitHub, GitLab, SourceForge, and
      BitBucket. Adversaries may search code repositories of common AI tools, frameworks, models, or agentic
      systems that are used--but not owned--by the victim.
    tactics:
    - reconnaissance
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0095.000
    deprecated: false
    revoked: false
  AML.T0096:
    name: AI Service API
    description: Adversaries may communicate using the API of an AI service on the victim's system. The
      adversary's commands to the victim system, and often the results, are embedded in the normal traffic
      of the AI service.
    tactics:
    - command-and-control
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0096
    deprecated: false
    revoked: false
  AML.T0097:
    name: Virtualization/Sandbox Evasion
    description: Adversaries may employ various means to detect and avoid virtualization and analysis
      environments. This may include changing behaviors based on the results of checks for the presence
      of artifacts indicative of a virtual machine environment (VME) or sandbox. If the adversary detects
      a VME, they may alter their malware to disengage from the victim or conceal the core functions of
      the implant. They may also search for VME artifacts before dropping secondary or additional payloads.
    tactics:
    - defense-evasion
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0097
    deprecated: false
    revoked: false
  AML.T0098:
    name: AI Agent Tool Credential Harvesting
    description: Adversaries may attempt to use their access to an AI agent on the victim's system to
      retrieve data from available agent tools to collect credentials. Agent tools may connect to a wide
      range of sources that may contain credentials including document stores (e.g. SharePoint, OneDrive
      or Google Drive), code repositories (e.g. GitHub or GitLab), or enterprise productivity tools (e.g.
      as email providers or Slack), and local notetaking tools (e.g. Obsidian or Apple Notes).
    tactics:
    - credential-access
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0098
    deprecated: false
    revoked: false
  AML.T0099:
    name: AI Agent Tool Data Poisoning
    description: Adversaries may manipulate data in a victim-controlled, trusted, or connected data source
      that is accessible through an AI agent tool. Poisoned data may be placed in document repositories,
      databases, source-code repositories, knowledge bases, search indexes, enterprise applications, or
      third-party data services used by the agent.
    tactics:
    - persistence
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0099
    deprecated: false
    revoked: false
  AML.T0100:
    name: AI Agent Clickbait
    description: Adversaries may craft deceptive web content designed to bait Computer-Using AI agents
      or AI web browsers into taking unintended actions, such as clicking buttons, copying code, or navigating
      to specific web pages. These attacks exploit the agent's interpretation of UI content, visual cues,
      or prompt-like language embedded in the site. When successful, they can lead the agent to inadvertently
      copy and execute malicious code on the user's operating system.
    tactics:
    - execution
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0100
    deprecated: false
    revoked: false
  AML.T0101:
    name: Data Destruction via AI Agent Tool Invocation
    description: Adversaries may invoke an AI agent's tool capable of performing mutative operations to
      perform Data Destruction. Adversaries may destroy data and files on specific systems or in large
      numbers on a network to interrupt availability to systems, services, and network resources.
    tactics:
    - impact
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0101
    deprecated: false
    revoked: false
  AML.T0102:
    name: Generate Malicious Commands
    description: Adversaries may use large language models (LLMs) to dynamically generate malicious commands
      from natural language. Dynamically generated commands may be harder to detect as the attack signature
      is constantly changing. AI-generated commands may also allow adversaries to more rapidly adapt to
      different environments and adjust their tactics.
    tactics:
    - ai-attack-adaptation
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0102
    deprecated: false
    revoked: false
  AML.T0103:
    name: Deploy AI Agent
    description: Adversaries may launch AI agents in the victim's environment to execute actions on their
      behalf. AI agents may have access to a wide range of tools and data sources, as well as permissions
      to access and interact with other services and systems in the victim's environment. The adversary
      may leverage these capabilities to carry out their operations.
    tactics:
    - execution
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0103
    deprecated: false
    revoked: false
  AML.T0105:
    name: Escape to Host
    description: Adversaries may break out of a container or virtualized environment to gain access to
      the underlying host. This can allow an adversary access to other containerized or virtualized resources
      from the host level or to the host itself. In principle, containerized / virtualized resources should
      provide a clear separation of application functionality and be isolated from the host environment.
    tactics:
    - privilege-escalation
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0105
    deprecated: false
    revoked: false
  AML.T0106:
    name: Exploitation for Credential Access
    description: Adversaries may exploit software vulnerabilities in an attempt to collect credentials.
      Exploitation of a software vulnerability occurs when an adversary takes advantage of a programming
      error in a program, service, or within the operating system software or kernel itself to execute
      adversary-controlled code.
    tactics:
    - credential-access
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0106
    deprecated: false
    revoked: false
  AML.T0107:
    name: Exploitation for Defense Evasion
    description: Adversaries may exploit a system or application vulnerability to bypass security features.
      Exploitation of a vulnerability occurs when an adversary takes advantage of a programming error
      in a program, service, or within the operating system software or kernel itself to execute adversary-controlled
      code. Vulnerabilities may exist in defensive security software that can be used to disable or circumvent
      them.
    tactics:
    - defense-evasion
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0107
    deprecated: false
    revoked: false
  AML.T0108:
    name: AI Agent
    description: Adversaries may abuse AI agents present on the victim's system for command and control.
      AI agents are often granted access to tools that can execute shell commands, reach out to the internet,
      and interact with other services in the victim's environment, making them capable C2 agents.
    tactics:
    - command-and-control
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0108
    deprecated: false
    revoked: false
  AML.T0109:
    name: AI Supply Chain Rug Pull
    description: Adversaries may publish legitimate AI components or software, gain user adoption, then
      push an update with a malicious variant, leading to [AI Supply Chain Compromise](/techniques/AML.T0010).
      More scrutiny is often placed on a supply chain dependency when it is first being considered for
      inclusion in an AI system. Performing a rug pull may allow adversaries to bypass these defenses
      and be more likely to achieve [Initial Access](/tactics/AML.TA0004).
    tactics:
    - defense-evasion
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0109
    deprecated: false
    revoked: false
  AML.T0110:
    name: AI Agent Tool Poisoning
    description: Adversaries may poison tools used by AI agents by introducing or modifying malicious
      content or behavior in a tool's model-visible definition, executable implementation, or runtime
      responses. Tools may include built-in integrations, locally installed packages, remotely hosted
      services, Model Context Protocol (MCP) servers and tools, and agent skills or similar capability
      packages.
    tactics:
    - persistence
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0110
    deprecated: false
    revoked: false
  AML.T0110.000:
    name: Definition and Instructions
    description: Adversaries may poison the model-visible definition or operational instructions of an
      AI agent tool to manipulate how an agent interprets, selects, or invokes the tool. The poisoned
      content may be contained in tool descriptions, docstrings, parameter names, help text, input or
      output schemas, annotations, examples, manifests, skill instruction files, or other static content
      used to explain a tool's capabilities to the model.
    tactics:
    - persistence
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0110.000
    deprecated: false
    revoked: false
  AML.T0110.001:
    name: Implementation
    description: Adversaries may poison the executable implementation of an AI agent tool so that normal
      tool invocation produces unauthorized behavior or hidden side effects. The tool may continue to
      provide its represented functionality while also accessing additional data, modifying requests,
      changing recipients or destinations, executing unauthorized commands, weakening security controls,
      or performing covert data exfiltration.
    tactics:
    - persistence
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0110.001
    deprecated: false
    revoked: false
  AML.T0110.002:
    name: Runtime Response
    description: Adversaries may poison the runtime response channel of a malicious or compromised AI
      agent tool by deliberately returning content intended to influence the model's subsequent reasoning,
      decisions, or actions. Poisoned responses may contain malicious instructions, deceptive data, fabricated
      errors, embedded resources, or other content designed to be treated as trusted context after an
      approved tool invocation.
    tactics:
    - persistence
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0110.002
    deprecated: false
    revoked: false
  AML.T0111:
    name: AI Supply Chain Reputation Inflation
    description: AI Supply Chain Reputation Inflation is the process of building or leveraging genuinely
      credible-looking trust signals to increase the perceived legitimacy of AI supply chain components,
      with the goal of driving adoption of malicious or compromised assets.
    tactics:
    - defense-evasion
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0111
    deprecated: false
    revoked: false
  AML.T0112:
    name: Machine Compromise
    description: Adversaries may compromise a machine by exploiting or manipulating AI-enabled components
      on the system. Compromising a victim system allows the adversary to execute arbitrary code, steal
      credentials, exfiltrate data, and continue to persist on the system.
    tactics:
    - impact
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0112
    deprecated: false
    revoked: false
  AML.T0112.000:
    name: Local AI Agent
    description: Adversaries may achieve full system compromise by abusing AI agents running locally on
      a host, such as computer-use agents or AI-driven browsers. These agents are designed to autonomously
      interact with the operating system, applications, and external services, often with broad permissions
      to execute commands, access files, manage credentials, and control user workflows.
    tactics:
    - impact
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0112.000
    deprecated: false
    revoked: false
  AML.T0112.001:
    name: AI Artifacts
    description: Adversaries may achieve full system compromise by introducing malicious AI artifacts,
      such as models or data, that contain embedded malware or other malicious commands. AI artifacts
      are often stored in model registries or data stores and may affect many systems that pull these
      resources.
    tactics:
    - impact
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0112.001
    deprecated: false
    revoked: false
  AML.T0113:
    name: Steal Web Session Cookie
    description: Adversaries may steal web application or service session cookies used to authenticate
      users to AI-enabled systems, AI services, or supporting enterprise applications.
    tactics:
    - credential-access
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0113
    deprecated: false
    revoked: false
  AML.T0114:
    name: AI Service Web Interface
    description: Adversaries may communicate with compromised systems by abusing the web interface of
      an AI service as an intermediary command-and-control relay. Instead of connecting directly to attacker-controlled
      infrastructure or using an AI provider's API, malware may open or automate a browser, embedded browser,
      or WebView component to interact with a public AI assistant.
    tactics:
    - command-and-control
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0114
    deprecated: false
    revoked: false
  AML.T0115:
    name: Publish Poisoned AI Artifacts
    description: Adversaries may create or modify AI artifacts and publish them through public or shared
      distribution channels to facilitate compromise of downstream AI systems. Poisoned AI artifacts may
      include datasets, models, and AI agent tools containing malicious content, behaviors, code, or configurations.
    tactics:
    - resource-development
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0115
    deprecated: false
    revoked: false
  AML.T0115.000:
    name: Datasets
    description: Adversaries may publish poisoned datasets intended for training or fine-tuning AI models.
      The dataset may be newly created or a modified variant of a legitimate dataset and may contain manipulated
      samples, labels, annotations, or metadata.
    tactics:
    - resource-development
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0115.000
    deprecated: false
    revoked: false
  AML.T0115.001:
    name: Models
    description: Adversaries may publish poisoned AI models through model registries, code repositories,
      or other model distribution channels. The model may be newly created or a modified variant of a
      legitimate model and may contain manipulated weights, configurations, architecture, serialized code,
      or other components that produce malicious behavior or execute malicious code.
    tactics:
    - resource-development
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0115.001
    deprecated: false
    revoked: false
  AML.T0115.002:
    name: AI Agent Tools
    description: Adversaries may create and publish poisoned AI agent tools. Poisoned tools may contain
      malicious model-visible definitions or instructions, hidden executable behavior, or runtime responses
      designed to manipulate an AI agent. Tools may be published through source code repositories, package
      registries, agent tool or skill registries, or adversary-controlled remote services. The tool may
      be newly created or a modified variant of a legitimate tool and may produce malicious behavior when
      selected, installed, or invoked by a victim's AI agent.
    tactics:
    - resource-development
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0115.002
    deprecated: false
    revoked: false
  AML.T0116:
    name: Autonomous Reconnaissance
    description: Adversaries may use autonomous AI agents to conduct [Reconnaissance](/tactics/AML.TA0002)
      activities. Given an objective, target, or partial lead, an agent may autonomously determine what
      information to obtain and how to investigate it. It may interpret observations, identify gaps in
      its understanding of the externally observable attack surface, and select subsequent reconnaissance
      actions without a human specifying each investigative step.
    tactics:
    - reconnaissance
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0116
    deprecated: false
    revoked: false
  AML.T0117:
    name: Autonomous Attack-Path Adaptation
    description: Adversaries may use an AI agent to autonomously construct and repeatedly revise an attack
      path toward an adversary-defined objective. Given a high-level objective, the system may derive
      intermediate objectives, identify prerequisites, and compare candidate paths, and incorporate observations
      from previous actions to adaptively sequence techniques without a human directing each step.
    tactics:
    - ai-attack-adaptation
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0117
    deprecated: false
    revoked: false
  AML.T0118:
    name: Autonomous AI Agent Communication
    description: Autonomous AI agents may exchange operational information with other AI agents, sub-agents,
      or independent agent runs. Exchanged information may include discoveries, objectives, tasking, capabilities,
      credentials, constraints, operating rules, task state, targeting information, instructions, or results.
      Communication enables autonomous AI agents to coordinate activities, share discoveries, delegate
      work, request assistance, validate results, or revise future actions without requiring a human operator
      to direct each interaction.
    tactics:
    - ai-attack-adaptation
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0118
    deprecated: false
    revoked: false
  AML.T0118.000:
    name: Communication via Shared Artifacts
    description: Autonomous AI agents may communicate by creating or modifying artifacts in a shared resource
      that persists outside their individual execution contexts. Shared artifacts may convey discoveries,
      objectives, tasking, credentials, capabilities, operating rules, progress, scripts, targeting information,
      instructions, or results.
    tactics:
    - ai-attack-adaptation
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0118.000
    deprecated: false
    revoked: false
  AML.T0118.001:
    name: Direct Agent Communication
    description: Autonomous AI agents may communicate directly through agent-to-agent, sub-agent, or orchestrator
      interfaces. An agent may provide another agent with operational context, discoveries, objectives,
      tasking, capabilities, credentials, or constraints, and may receive status, findings, or completed
      work in response.
    tactics:
    - ai-attack-adaptation
    is_subtechnique: true
    url: https://atlas.mitre.org/techniques/AML.T0118.001
    deprecated: false
    revoked: false
  AML.T0119:
    name: Exploit Automated Artifact Processing Pipeline
    description: Adversaries may submit, publish, or modify an artifact in a way that triggers an automated
      processing pipeline. As the pipeline handles the artifact, adversary-controlled content or configuration
      may exploit a weakness in the processing logic, causing the processor to act outside its intended
      behavior using the permissions and access of a processing worker.
    tactics:
    - initial-access
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0119
    deprecated: false
    revoked: false
  AML.T0120:
    name: AI Artifact Repository
    description: Adversaries may repurpose AI artifact repositories as asynchronous command-and-control
      channels. Commands, payloads, or tasking may be placed in repository objects for a compromised system
      to retrieve or poll. The compromised system may then write execution results, status, or collected
      information back to the repository for retrieval by the adversary.
    tactics:
    - command-and-control
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0120
    deprecated: false
    revoked: false
  AML.T0121:
    name: AI Agent Environment Reconstruction
    description: An autonomous AI agent may reconstruct the environment needed to continue an existing
      operation after its execution environment is lost, reset, replaced, denied, or made unusable. The
      agent may recover or recreate tools, dependencies, configuration, credentials or access paths, communication
      or coordination resources, working artifacts, and externally stored operational state in order to
      resume the same objective.
    tactics:
    - persistence
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0121
    deprecated: false
    revoked: false
  AML.T0122:
    name: Exploitation of Remote Services
    description: Adversaries may exploit a software or design weakness in a service reachable from their
      current environment to gain unauthorized access to another system, component, network, or trust
      boundary. Exploitation may allow the adversary to execute code, access protected resources, invoke
      unauthorized operations, obtain the service's privileges, or cause the service to make network requests
      or perform actions on the adversary's behalf.
    tactics:
    - lateral-movement
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0122
    deprecated: false
    revoked: false
  AML.T0123:
    name: Obfuscated Files or Information
    description: Adversaries may attempt to make an executable or file difficult to discover or analyze
      by encrypting, encoding, or otherwise obfuscating its contents on the system or in transit. This
      is common behavior that can be used across different platforms and the network to evade defenses.
    tactics:
    - defense-evasion
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0123
    deprecated: false
    revoked: false
  AML.T0124:
    name: Autonomous Attack Orchestration
    description: Adversaries may use autonomous AI systems as an operational control layer to manage multiple
      distinct autonomous agents or sub-agents toward a common adversary-defined objective. The orchestrating
      system may create assignments, select executors, allocate tools or resources, establish dependencies,
      schedule or synchronize activities, and track progress without a human directing each assignment.
    tactics:
    - ai-attack-adaptation
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0124
    deprecated: false
    revoked: false
  AML.T0125:
    name: Create Account
    description: Adversaries may create an account to maintain access to an AI system or its supporting
      infrastructure. With a sufficient level of access, creating such accounts may be used to establish
      secondary credentialed access that do not require persistent remote access tools to be deployed
      on the system.
    tactics:
    - persistence
    is_subtechnique: false
    url: https://atlas.mitre.org/techniques/AML.T0125
    deprecated: false
    revoked: false
  AML.T0126:
    name: Automated Collection
    description: Adversaries may use automated techniques to collect data from AI systems and supporting
      enterprise environments. Automation may use scripts, command interpreters, command-line tools, or
      AI agent tools to identify, retrieve, copy, or aggregate data without a human selecting each individual
      item.
